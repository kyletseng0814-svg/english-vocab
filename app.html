<style>
  :root {
    --bg: #f7f7f2; --card: #ffffff; --ink: #2d2d2d; --sub: #8a8a84;
    --accent: #4a7c59; --accent-soft: #e6efe9;
    --wrong: #c0504d; --wrong-soft: #f6e4e3;
    --gold: #d9a441; --line: #e8e8e2;
  }
  /* ===== 佈景主題 ===== */
  :root[data-theme="forest"] {
    --bg: #f7f7f2; --card: #ffffff; --ink: #2d2d2d; --sub: #8a8a84;
    --accent: #4a7c59; --accent-soft: #e6efe9; --wrong: #c0504d; --wrong-soft: #f6e4e3; --gold: #d9a441; --line: #e8e8e2;
  }
  :root[data-theme="ocean"] {
    --bg: #eef4f8; --card: #ffffff; --ink: #24303a; --sub: #7a8a96;
    --accent: #2e6f9e; --accent-soft: #dcebf5; --wrong: #c0504d; --wrong-soft: #f6e4e3; --gold: #e0a13a; --line: #dbe6ee;
  }
  :root[data-theme="sunset"] {
    --bg: #fbf3ec; --card: #ffffff; --ink: #3a2c22; --sub: #9a897c;
    --accent: #d9722f; --accent-soft: #fbe6d6; --wrong: #c0392b; --wrong-soft: #f7e0dc; --gold: #e0a13a; --line: #efe2d6;
  }
  :root[data-theme="berry"] {
    --bg: #f4f0f8; --card: #ffffff; --ink: #322a3c; --sub: #8c8296;
    --accent: #7a4fa0; --accent-soft: #ece2f5; --wrong: #c0504d; --wrong-soft: #f6e4e3; --gold: #d9a441; --line: #e5ddec;
  }
  :root[data-theme="sakura"] {
    --bg: #fbf0f3; --card: #ffffff; --ink: #3a2a30; --sub: #9c8a90;
    --accent: #c65b7c; --accent-soft: #f8e0e8; --wrong: #c0392b; --wrong-soft: #f7e0dc; --gold: #d9a441; --line: #f0e2e6;
  }
  :root[data-theme="night"] {
    --bg: #16181c; --card: #22262b; --ink: #e8eaed; --sub: #9aa0a8;
    --accent: #5aa06f; --accent-soft: #263528; --wrong: #e0736f; --wrong-soft: #3a2624; --gold: #e0b64a; --line: #30353b;
  }
  .theme-picker { margin-top: 24px; text-align: center; }
  .tp-label { font-size: 14px; color: var(--sub); margin-bottom: 12px; }
  .swatches { display: flex; justify-content: center; gap: 14px; flex-wrap: wrap; }
  .swatch {
    width: 48px; height: 48px; border-radius: 50%; cursor: pointer; position: relative;
    border: 2px solid var(--line); padding: 0; transition: transform .08s;
  }
  .swatch:active { transform: scale(.9); }
  .swatch.active { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 35%, transparent); }
  .swatch.active::after {
    content: "✓"; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 20px; font-weight: 900; text-shadow: 0 1px 3px rgba(0,0,0,.55);
  }
  .tp-name { margin-top: 10px; font-size: 13px; color: var(--sub); min-height: 18px; }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: ui-rounded, "SF Pro Rounded", -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif;
    background: var(--bg); color: var(--ink);
    max-width: 560px; margin: 0 auto; padding: 20px 16px 48px;
  }
  /* 按鈕預設用主題文字色（不然深色主題會出現看不見的黑字）；特殊狀態各自覆蓋 */
  button { color: var(--ink); font-family: inherit; }
  /* 活潑動畫：進場 Q 彈、答對蹦一下 */
  @keyframes pop-in { 0% { transform: scale(.6); opacity: 0; } 60% { transform: scale(1.08); } 100% { transform: scale(1); opacity: 1; } }
  @keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.18); } 100% { transform: scale(1); } }
  h1 { font-size: 22px; margin-bottom: 4px; }
  .app-title { text-align: center; font-size: 48px; font-weight: 900; letter-spacing: 10px; text-indent: 10px; margin: 20px 0 6px; animation: pop-in .5s cubic-bezier(.34,1.56,.64,1); }
  .sub { color: var(--sub); font-size: 14px; margin-bottom: 20px; text-align: center; }
  .library-btn {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%; margin-top: 14px; padding: 17px; border-radius: 20px;
    font-size: 19px; font-weight: 800; color: var(--ink);
    background: var(--card); border: 2px solid var(--line); cursor: pointer;
    box-shadow: 0 4px 0 var(--line);
    transition: transform .09s ease, box-shadow .09s ease;
  }
  .library-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }
  .lib-title { text-align: center; font-size: 34px; font-weight: 900; margin: 4px 0 20px; }

  /* 進度儀表板 */
  .progress-btn {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%; margin-top: 10px; padding: 17px; border-radius: 20px;
    font-size: 19px; font-weight: 800; color: #fff; background: var(--accent);
    border: none; cursor: pointer;
    box-shadow: 0 5px 0 color-mix(in srgb, var(--accent), #000 22%), 0 8px 16px color-mix(in srgb, var(--accent) 30%, transparent);
    transition: transform .09s ease, box-shadow .09s ease;
  }
  .progress-btn:active { transform: translateY(4px); box-shadow: 0 1px 0 color-mix(in srgb, var(--accent), #000 22%), 0 3px 8px color-mix(in srgb, var(--accent) 26%, transparent); }
  /* 每日練習大按鈕 */
  .daily-btn { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 3px;
    border: none; border-radius: 20px; padding: 15px; margin: 2px 0 18px; cursor: pointer; color: #fff;
    background: linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent), var(--gold) 45%));
    box-shadow: 0 5px 0 color-mix(in srgb, var(--accent), #000 24%), 0 8px 18px color-mix(in srgb, var(--accent) 32%, transparent);
    transition: transform .08s; }
  .daily-btn:active { transform: translateY(4px); box-shadow: 0 1px 0 color-mix(in srgb, var(--accent), #000 24%), 0 3px 8px color-mix(in srgb, var(--accent) 26%, transparent); }
  .daily-btn .db-title { font-size: 20px; font-weight: 900; }
  .daily-btn .db-sub { font-size: 12.5px; opacity: .92; font-weight: 600; }
  /* 班級（輸代碼加入）*/
  .class-card { background: var(--card); border: 2px solid var(--line); border-radius: 18px; padding: 16px; margin-bottom: 18px; }
  .class-card.joined { border-color: var(--accent); background: var(--accent-soft); }
  .cc-title { font-size: 14px; font-weight: 700; color: var(--ink); margin-bottom: 10px; }
  .cc-title b { color: var(--accent); }
  .cc-row { display: flex; gap: 8px; }
  .cc-input { flex: 1; min-width: 0; border: 2px solid var(--line); background: var(--bg); border-radius: 999px;
    padding: 10px 16px; font-size: 15px; color: var(--ink); text-transform: uppercase; letter-spacing: .12em; font-weight: 700; }
  .cc-input:focus { outline: none; border-color: var(--accent); }
  .cc-btn { flex: 0 0 auto; border: none; background: var(--accent); color: #fff; font-weight: 800; font-size: 14px;
    border-radius: 999px; padding: 10px 20px; cursor: pointer; transition: transform .08s; }
  .cc-btn:active { transform: scale(.95); }
  .cc-msg { font-size: 13px; color: var(--sub); margin-top: 8px; min-height: 18px; }
  .cc-meta { font-size: 13px; color: var(--sub); margin-bottom: 12px; }
  .cc-actions { display: flex; gap: 16px; }
  .cc-link { background: none; border: none; color: var(--accent); font-weight: 700; font-size: 14px; cursor: pointer; padding: 0; }
  .cc-link.danger { color: var(--sub); }
  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
  .stat-card { background: var(--card); border: 2px solid var(--line); border-radius: 22px; padding: 20px 16px; text-align: center; }
  .stat-card.wide { grid-column: 1 / -1; }
  .stat-card.hero { background: var(--accent-soft); border-color: var(--accent); }
  .stat-card .num { font-size: 34px; font-weight: 900; color: var(--accent); line-height: 1.1; }
  .stat-card .num small { font-size: 18px; }
  .stat-card .lbl { font-size: 13px; color: var(--sub); margin-top: 6px; }
  .mastery-bar { height: 12px; border-radius: 6px; background: var(--line); overflow: hidden; margin-top: 12px; }
  .mastery-bar > div { height: 100%; background: var(--accent); transition: width .4s; }
  .prog-empty { text-align: center; color: var(--sub); font-size: 15px; padding: 30px 10px; line-height: 1.7; }
  /* 每日目標 + 一週打卡 */
  .today-card { background: var(--card); border: 2px solid var(--line); border-radius: 22px; padding: 18px 16px; margin-bottom: 16px; }
  .today-top { display: flex; align-items: center; gap: 18px; }
  .goal-ring { flex: 0 0 auto; width: 108px; height: 108px; border-radius: 50%;
    background: conic-gradient(var(--accent) calc(var(--pct) * 1%), var(--line) 0); display: flex; align-items: center; justify-content: center; }
  .goal-ring.done { background: conic-gradient(var(--gold) 100%, var(--gold) 0); }
  .goal-inner { width: 82px; height: 82px; border-radius: 50%; background: var(--card); display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .goal-inner b { font-size: 30px; font-weight: 900; color: var(--accent); line-height: 1; }
  .goal-ring.done .goal-inner b { color: var(--gold); }
  .goal-inner span { font-size: 12px; color: var(--sub); margin-top: 2px; }
  .today-right { flex: 1; min-width: 0; }
  .today-msg { font-size: 14px; font-weight: 700; color: var(--ink); margin-bottom: 10px; }
  .today-msg.hit { color: var(--gold); }
  .week-row { display: flex; gap: 4px; }
  .day-cell { flex: 1; text-align: center; }
  .day-dot { width: 24px; height: 24px; border-radius: 50%; margin: 0 auto 4px; border: 2px solid var(--line); background: var(--card); box-sizing: border-box; }
  .day-dot.on { background: var(--accent); border-color: var(--accent); }
  .day-dot.goal { background: var(--gold); border-color: var(--gold); }
  .day-dot.today { box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 32%, transparent); }
  .day-lbl { font-size: 11px; color: var(--sub); }
  .goal-set { display: flex; align-items: center; gap: 8px; margin-top: 14px; }
  .goal-set .gs-label { font-size: 12px; color: var(--sub); margin-right: 2px; }
  .goal-set button { border: 2px solid var(--line); background: var(--bg); color: var(--sub); border-radius: 999px; padding: 4px 14px; font-size: 13px; font-weight: 700; cursor: pointer; transition: transform .08s; }
  .goal-set button:active { transform: scale(.94); }
  .goal-set button.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  h2 { font-size: 16px; margin: 22px 0 10px; }
  .hidden { display: none !important; }

  .panel { background: var(--card); border: 2px solid var(--line); border-radius: 24px; padding: 20px; }
  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 14px; color: var(--sub); margin-bottom: 8px; font-weight: 600; }
  .choices { display: flex; gap: 8px; flex-wrap: wrap; }
  .choice {
    border: 2px solid var(--line); background: var(--bg); border-radius: 999px;
    padding: 9px 17px; font-size: 15px; font-weight: 600; cursor: pointer;
    transition: transform .12s cubic-bezier(.34,1.56,.64,1);
  }
  .choice:active { transform: scale(.9); }
  .choice.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 800; }
  .btn {
    width: 100%; padding: 15px; border-radius: 18px; font-size: 16px; font-weight: 700; cursor: pointer;
    border: 2px solid var(--line); background: var(--card);
    transition: transform .09s ease;
  }
  .btn:active { transform: scale(.97); }
  .btn.primary {
    background: var(--accent); border-color: transparent; color: #fff; font-weight: 800;
    box-shadow: 0 5px 0 color-mix(in srgb, var(--accent), #000 22%), 0 8px 16px color-mix(in srgb, var(--accent) 28%, transparent);
    transition: transform .09s ease, box-shadow .09s ease;
  }
  .btn.primary:active {
    transform: translateY(4px);
    box-shadow: 0 1px 0 color-mix(in srgb, var(--accent), #000 22%), 0 3px 8px color-mix(in srgb, var(--accent) 24%, transparent);
  }
  .btn-row { display: flex; gap: 10px; margin-top: 10px; }

  .search-wrap { margin-bottom: 18px; }
  .search-bar {
    display: flex; align-items: center; gap: 8px;
    background: var(--card); border: 2px solid var(--line); border-radius: 999px;
    padding: 8px 8px 8px 18px;
  }
  .search-bar:focus-within { border-color: var(--accent); }
  .search-bar .s-icon { color: var(--sub); font-size: 15px; }
  .search-bar input {
    flex: 1; border: none; outline: none; font-size: 16px;
    background: transparent; color: var(--ink); min-width: 0;
  }
  .s-btn { background: var(--accent); color: #fff; font-weight: 700; border: none; border-radius: 999px; padding: 9px 18px; font-size: 14px; cursor: pointer; transition: transform .09s ease; }
  .s-btn:active { transform: scale(.92); }
  .s-msg { color: var(--sub); font-size: 14px; margin-top: 10px; text-align: center; }
  .s-card { background: var(--card); border: 2px solid var(--line); border-radius: 20px; padding: 16px; margin-top: 10px; }
  .s-card .s-word { font-size: 22px; font-weight: 700; }
  .s-card .s-word span { color: var(--sub); font-size: 14px; font-weight: 400; }
  .s-card .s-zh { margin-top: 4px; font-size: 15px; }
  .s-card .s-en { margin-top: 6px; color: var(--sub); font-size: 14px; line-height: 1.5; }
  .s-card .btn { margin-top: 12px; }
  .badge { background: var(--gold); color: #fff; font-size: 11px; border-radius: 6px; padding: 1px 6px; margin-left: 4px; }

  .letter-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .letter-cell {
    background: var(--card); border: 2px solid var(--line); border-radius: 18px;
    padding: 14px 4px; text-align: center; cursor: pointer;
    box-shadow: 0 4px 0 var(--line); transition: transform .09s ease, box-shadow .09s ease;
  }
  .letter-cell:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }
  .letter-cell .lt { font-size: 22px; font-weight: 800; color: var(--accent); }
  .letter-cell .lc { font-size: 12px; color: var(--sub); margin-top: 2px; }
  .letter-cell.empty .lt, .letter-cell.empty .lc { color: var(--line); }

  .letter-group { margin-bottom: 8px; }
  .letter-head {
    display: flex; justify-content: space-between; align-items: center;
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 11px 14px; cursor: pointer; font-weight: 700; font-size: 16px;
    color: var(--accent); user-select: none;
  }
  .letter-head .count { color: var(--sub); font-size: 13px; font-weight: 400; margin-left: 8px; }
  .letter-head .chev { color: var(--sub); font-size: 14px; transition: transform .15s; }
  .letter-head.open { background: var(--accent-soft); border-color: var(--accent); }
  .letter-head.open .chev { transform: rotate(90deg); }
  .letter-body { margin-top: 6px; padding-left: 4px; }
  .vocab-item { background: var(--card); border: 2px solid var(--line); border-radius: 16px; padding: 12px 15px; margin-bottom: 8px; font-size: 15px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; transition: transform .09s ease; }
  .vocab-item:active { transform: scale(.98); }
  .vocab-item span { color: var(--sub); font-size: 13px; }
  .vocab-item .arrow { color: var(--line); font-size: 16px; }

  .overlay { position: fixed; inset: 0; background: rgba(45,45,45,.4); display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 10; }
  .detail { background: var(--card); border-radius: 18px; padding: 24px 22px; max-width: 480px; width: 100%; max-height: 82vh; overflow-y: auto; }
  .detail .dtop { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .detail .dword { font-size: 32px; font-weight: 700; }
  .detail .dphon { color: var(--sub); font-size: 16px; }
  .detail .dzh { font-size: 18px; margin-top: 6px; }
  .detail .dzh b { color: var(--gold); margin-right: 6px; }
  .detail .section { margin-top: 16px; }
  .detail .label { font-size: 12px; color: var(--accent); font-weight: 700; letter-spacing: 1px; margin-bottom: 4px; }
  .detail .val { font-size: 15px; line-height: 1.7; white-space: pre-line; }
  .detail .val em { color: var(--sub); }
  .detail .dfoot { margin-top: 18px; color: var(--sub); font-size: 12px; text-align: right; }
  .detail .btn-row { margin-top: 14px; }
  .nav-arrow {
    position: absolute; top: 50%; transform: translateY(-50%);
    width: 42px; height: 42px; border-radius: 50%;
    background: var(--card); border: 1px solid var(--line);
    color: var(--accent); font-size: 24px; font-weight: 700; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 8px rgba(0,0,0,.12); z-index: 11;
  }
  .nav-arrow.left { left: 8px; }
  .nav-arrow.right { right: 8px; }
  .nav-arrow:disabled { opacity: .2; cursor: default; }

  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .back { color: var(--sub); font-size: 14px; cursor: pointer; background: none; border: none; }
  .progress-text { font-size: 13px; color: var(--sub); }
  .bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin-bottom: 24px; }
  .bar > div { height: 100%; background: var(--accent); width: 0; transition: width .25s; }

  .clue { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px; margin-bottom: 18px; }
  .clue .zh { font-size: 22px; font-weight: 700; }
  .clue .pos { color: var(--gold); font-weight: 600; margin-right: 6px; }
  .clue .en { color: var(--sub); font-size: 15px; line-height: 1.6; margin-top: 8px; }
  .hint-letters {
    font-family: "SF Mono", Menlo, monospace; font-size: 26px; letter-spacing: 6px;
    text-align: center; margin: 18px 0 6px; font-weight: 600;
  }
  .hint-len { text-align: center; color: var(--sub); font-size: 13px; margin-bottom: 14px; }
  input.spell {
    width: 100%; padding: 14px; font-size: 20px; text-align: center;
    border: 1.5px solid var(--line); border-radius: 12px; outline: none;
    font-family: "SF Mono", Menlo, monospace; letter-spacing: 2px;
    background: var(--card); color: var(--ink);
  }
  input.spell:focus { border-color: var(--accent); }
  input.spell.ok { border-color: var(--accent); background: var(--accent-soft); }
  input.spell.bad { border-color: var(--wrong); background: var(--wrong-soft); }
  .feedback { min-height: 76px; margin-top: 14px; text-align: center; font-size: 15px; line-height: 1.6; }
  .feedback .word { font-size: 20px; font-weight: 700; }
  .feedback .ex { color: var(--sub); font-size: 14px; }
  .speak.sm { margin: 0 0 0 6px; padding: 3px 12px; font-size: 14px; vertical-align: middle; }

  /* 例句填空模式 */
  .q-sentence { font-size: 20px; line-height: 2; text-align: center; margin: 14px 4px 18px; color: var(--ink); }
  .q-sentence .blank { white-space: nowrap; }
  .q-sentence .bk-hint { display: inline-block; min-width: 15px; border-bottom: 2px solid var(--accent); color: var(--accent); font-weight: 700; text-align: center; }
  .q-sentence .bk-line { display: inline-block; width: 15px; border-bottom: 2px solid var(--sub); margin: 0 1px; }
  .q-sentence .bk-space { display: inline-block; width: 8px; }
  .q-sentence .q-def { font-style: italic; color: var(--sub); font-size: 16px; }

  .q-hint-pill { text-align: center; background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 11px 18px; font-size: 17px; margin-bottom: 20px; }
  .q-hint-pill .pos { color: var(--gold); font-weight: 600; margin-right: 6px; }

<script>
let opts = { qtype: "spell", source: "mine", count: 5, hint: 1 };

function practicePool() {
  if (opts.source === "dict" && typeof DICT !== "undefined") {
    // 只出中譯乾淨的題目；內容還在整理中的字先跳過
    return DICT.filter(d => d.enriched || (/[一-鿿]/.test(d.zh) && d.zh.length <= 60 && d.zh !== "（內容整理中）"));
  }
  return allWords();
}
// ===== 防呆：判斷一個字有沒有足夠資料玩某個模式 =====
function hasZh(v) { return !!v.zh && /[一-鿿]/.test(v.zh) && v.zh !== "（內容整理中）"; }
function hasClue(v) { return hasZh(v) || !!v.en || !!v.ex; } // 有中文、英文定義或例句任一，就有提示可出題
function wordFitsMode(v, mode) {
  if (mode === "zh") return hasZh(v);      // 英翻中：一定要有中文當正解
  if (mode === "fill") return hasClue(v);  // 填字：至少要有個提示才拼得出來
  return true;                              // 拼字、發音：光靠單字就能玩
}
let cur = { list: [], idx: 0, wrong: [], answered: false };

// ===== 班級（Supabase 後端）=====
const SB_URL = "https://qlhrpgqcyykygzrqbwyq.supabase.co";
const SB_KEY = "sb_publishable_P90iQrfhYflLElzN169VFA_sWmPy__F";
const TYPE_NAMES = { spell: "拼字", fill: "填字", zh: "英翻中", listen: "發音" };
async function sbRpc(fn, args) {
  const r = await fetch(SB_URL + "/rest/v1/rpc/" + fn, {
    method: "POST",
    headers: { apikey: SB_KEY, Authorization: "Bearer " + SB_KEY, "Content-Type": "application/json" },
    body: JSON.stringify(args || {})
  });
  const data = await r.json().catch(() => null);
  if (!r.ok) throw new Error((data && data.message) || "連線失敗");
  return data;
}
function loadClass() { try { return JSON.parse(localStorage.getItem("zibaoClass")); } catch (e) { return null; } }
function saveClass(c) { localStorage.setItem("zibaoClass", JSON.stringify(c)); }
function clearClass() { localStorage.removeItem("zibaoClass"); }
function normClass(c) { return { code: c.code, name: c.name || "班級", words: c.words || [], types: c.daily_types || [], updated_at: c.updated_at }; }

async function joinClass() {
  const input = document.getElementById("classCodeInput");
  const msg = document.getElementById("classMsg");
  const code = (input.value || "").trim().toUpperCase();
  if (code.length < 4) { msg.textContent = "請輸入班級代碼"; return; }
  msg.textContent = "查詢中…";
  try {
    const rows = await sbRpc("get_class", { p_code: code });
    if (!rows || !rows.length) { msg.textContent = "😅 找不到這個代碼，請跟老師確認"; return; }
    saveClass(normClass(rows[0]));
    renderHome();
  } catch (e) { msg.textContent = "連線失敗，檢查網路後再試一次"; }
}
async function refreshClass(silent) {
  const c = loadClass(); if (!c) return;
  const msg = document.getElementById("classMsg");
  if (!silent && msg) msg.textContent = "更新中…";
  try {
    const rows = await sbRpc("get_class", { p_code: c.code });
    if (rows && rows.length) saveClass(normClass(rows[0]));
    renderHome();
  } catch (e) { if (!silent && msg) msg.textContent = "更新失敗，稍後再試"; }
}
function leaveClass() {
  if (!confirm("要離開這個班級嗎？每日練習會改回核心題庫。")) return;
  clearClass(); renderHome();
}
// 掃 QR / 開連結時帶 ?class=代碼 → 自動加入
async function autoJoinClass(code) {
  code = (code || "").trim().toUpperCase();
  try {
    const rows = await sbRpc("get_class", { p_code: code });
    if (rows && rows.length) { saveClass(normClass(rows[0])); renderHome(); }
  } catch (e) {}
  try { history.replaceState({ view: "home" }, "", location.pathname); } catch (e) {}
}
function renderClassBox() {
  const box = document.getElementById("classBox");
  if (!box) return;
  const c = loadClass();
  if (c) {
    const ts = (c.types && c.types.length ? c.types : ["spell", "fill", "zh", "listen"]).map(t => TYPE_NAMES[t] || t).join(" · ");
    box.innerHTML =
      "<div class='class-card joined'>" +
        "<div class='cc-title'>🏫 已加入班級：<b>" + esc(c.name) + "</b></div>" +
        "<div class='cc-meta'>代碼 " + esc(c.code) + " · " + (c.words ? c.words.length : 0) + " 個單字 · 題型 " + ts + "</div>" +
        "<div class='cc-actions'>" +

        "</div>" +
      "</div>";

    box.innerHTML =
      "<div class='class-card'>" +

        "</div>" +
        "<div class='cc-msg' id='classMsg'></div>" +
      "</div>";
  }
}
function dailySubText() {
  const c = loadClass();
  if (c && c.words && c.words.length) {
    const ts = (c.types && c.types.length ? c.types : ["spell", "fill", "zh", "listen"]).map(t => TYPE_NAMES[t] || t).join(" · ");
    return "班級「" + c.name + "」· " + ts;
  }
  return "10 題混合：拼字 · 填字 · 英翻中 · 發音";
}

// ===== 手動新增的單字（存在這台裝置的瀏覽器） =====
const CUSTOM_KEY = "toeicCustomWords";
function loadCustom() { try { return JSON.parse(localStorage.getItem(CUSTOM_KEY) || "[]"); } catch (e) { return []; } }
function saveCustom(list) { localStorage.setItem(CUSTOM_KEY, JSON.stringify(list)); }
function cleanCustom() { // 已被正式收錄的字自動移除暫存版；字典補完內容後自動升級暫存字
  let list = loadCustom().filter(c => !VOCAB.some(v => v.w.toLowerCase() === c.w.toLowerCase()));
  if (typeof DICT !== "undefined") {
    list = list.map(c => {
      const d = DICT.find(x => x.enriched && x.w.toLowerCase() === c.w.toLowerCase());
      if (!d) return c;
      const up = Object.assign({}, d, { custom: true, added: c.added });
      delete up.enriched;
      return up;
    });
  }
  saveCustom(list);
}
function allWords() { return VOCAB.concat(loadCustom()); }

const POS_MAP = { noun: "n.", verb: "v.", adjective: "adj.", adverb: "adv.", preposition: "prep.", conjunction: "conj.", interjection: "int.", pronoun: "pron." };

async function lookup() {
  const input = document.getElementById("searchInput");
  const box = document.getElementById("searchResult");
  const word = input.value.trim().toLowerCase();
  if (!word || !/^[a-z][a-z' -]*$/.test(word)) { box.innerHTML = "<div class='s-msg'>請輸入英文單字</div>"; return; }
  if (allWords().some(v => v.w.toLowerCase() === word)) { box.innerHTML = "<div class='s-msg'>「" + word + "」已經在我的單字庫裡了</div>"; return; }

  // 優先查內建多益字典
  const dictHit = (typeof DICT !== "undefined") ? DICT.find(d => d.w.toLowerCase() === word) : null;
  if (dictHit) {
    box.innerHTML = "";
    const card = document.createElement("div");
    card.className = "s-card";
    card.innerHTML = "<div class='s-word'>" + dictHit.w + (dictHit.phon ? " <span>/" + dictHit.phon + "/</span>" : "") +
      "<span class='badge'>" + (dictHit.enriched ? "核心單字" : "核心單字 · 詳細內容製作中") + "</span></div>" +
      "<div class='s-zh'>" + (dictHit.pos ? dictHit.pos + " " : "") + dictHit.zh + "</div>" +
      (dictHit.en ? "<div class='s-en'>" + dictHit.en + "</div>" : "") +
      (dictHit.ex ? "<div class='s-en'><em>" + dictHit.ex + "</em></div>" : "");
    const btn = document.createElement("button");
    btn.className = "btn primary";
    btn.textContent = "＋ 加入我的單字庫";
    btn.onclick = () => {
      const entry = Object.assign({}, dictHit, { custom: true, added: new Date().toISOString().slice(0, 10) });
      delete entry.enriched;
      if (!dictHit.enriched) entry.usage = "📖 核心單字：詳細用法製作中，補完後會自動更新";
      const list = loadCustom();
      list.push(entry);
      saveCustom(list);
      input.value = "";
      renderHome();
      box.innerHTML = "<div class='s-msg'>✅ 已加入我的單字庫的 " + dictHit.w[0].toUpperCase() + " 書籤！</div>";
    };
    card.appendChild(btn);
    box.appendChild(card);
    return;
  }
  box.innerHTML = "<div class='s-msg'>查詢中…</div>";
  try {
    const [dictRes, transRes] = await Promise.all([
      fetch("https://api.dictionaryapi.dev/api/v2/entries/en/" + encodeURIComponent(word)),
      fetch("https://api.mymemory.translated.net/get?q=" + encodeURIComponent(word) + "&langpair=en|zh-TW")
    ]);
    if (!dictRes.ok) { box.innerHTML = "<div class='s-msg'>字典裡找不到「" + word + "」，請檢查拼字</div>"; return; }
    const dict = await dictRes.json();
    let zh = "";
    try { zh = (await transRes.json()).responseData.translatedText || ""; } catch (e) {}
    if (zh.toLowerCase() === word) zh = "";
    const meanings = dict[0].meanings || [];
    const phon = ((dict[0].phonetics || []).map(p => p.text).find(t => t) || "").replace(/^\/|\/$/g, "");
    const pos = meanings.map(m => POS_MAP[m.partOfSpeech] || m.partOfSpeech).slice(0, 2).join(" / ");
    const def = (meanings[0] && meanings[0].definitions[0]) ? meanings[0].definitions[0].definition : "";
    const withEx = meanings.flatMap(m => m.definitions).find(d => d.example);
    const entry = {
      w: word, pos: pos, phon: phon, zh: zh, en: def,
      ex: withEx ? withEx.example : "",
      usage: "📱 從網頁快速新增。下次把這個字丟給 Claude，就會補上考試/口語用法並正式收錄",
      syn: "", synNote: "", added: new Date().toISOString().slice(0, 10), custom: true
    };
    box.innerHTML = "";
    const card = document.createElement("div");
    card.className = "s-card";
    card.innerHTML = "<div class='s-word'>" + word + (phon ? " <span>/" + phon + "/</span>" : "") + "</div>" +
      "<div class='s-zh'>" + (pos ? pos + " " : "") + (zh || "（自動翻譯沒抓到中文，仍可加入）") + "</div>" +
      (def ? "<div class='s-en'>" + def + "</div>" : "");
    const btn = document.createElement("button");
    btn.className = "btn primary";
    btn.textContent = "＋ 加入我的單字庫";
    btn.onclick = () => {
      const list = loadCustom();
      list.push(entry);
      saveCustom(list);
      input.value = "";
      renderHome();
      box.innerHTML = "<div class='s-msg'>✅ 已加入我的單字庫的 " + word[0].toUpperCase() + " 書籤！（標「新」的字存在這台裝置上）</div>";
    };
    card.appendChild(btn);
    box.appendChild(card);
  } catch (e) {
    box.innerHTML = "<div class='s-msg'>查詢失敗，請確認網路後再試一次</div>";
  }
}

function loadProg() {
  try { return JSON.parse(localStorage.getItem("zibaoProgress")) || {}; } catch (e) { return {}; }
}
function saveProg(p) { localStorage.setItem("zibaoProgress", JSON.stringify(p)); }
// 用台北時間（UTC+8）算「今天」，避免半夜跨日算錯
function ymdLocal(ms) { return new Date(ms + 8 * 3600000).toISOString().slice(0, 10); }
function todayStr() { return ymdLocal(Date.now()); }

function recordSession(list, wrong) {
  if (!list || !list.length) return;
  const p = loadProg();
  p.totalAnswered = (p.totalAnswered || 0) + list.length;
  p.totalCorrect = (p.totalCorrect || 0) + (list.length - wrong.length);
  p.mastery = p.mastery || {};
  const wrongSet = new Set(wrong.map(w => w.w));
  list.forEach(v => {
    const m = p.mastery[v.w] || 0;
    p.mastery[v.w] = wrongSet.has(v.w) ? Math.max(0, m - 1) : Math.min(5, m + 1);
  });
  const today = todayStr();
  if (p.lastDate !== today) {
    const yst = ymdLocal(Date.now() - 86400000);
    p.streak = (p.lastDate === yst) ? (p.streak || 0) + 1 : 1;
    p.todayCount = 0;
    p.lastDate = today;
  }
  p.todayCount = (p.todayCount || 0) + list.length;
  // 每日打卡：記下每天練了幾個字（只保留最近 90 天，避免無限長大）
  p.days = p.days || {};
  p.days[today] = (p.days[today] || 0) + list.length;
  const keep = ymdLocal(Date.now() - 90 * 86400000);
  Object.keys(p.days).forEach(d => { if (d < keep) delete p.days[d]; });
  saveProg(p);
}

function renderProgress() {
  const p = loadProg();
  const body = document.getElementById("progBody");
  const learned = p.mastery ? Object.keys(p.mastery).length : 0;
  if (!learned) {
    document.getElementById("progUpdated").textContent = "";
    body.innerHTML = "<div class='prog-empty'>還沒有學習紀錄 📭<br>回首頁選一個單字庫，開始練習吧！<br>你的進度會自動記錄在這裡。</div>";
    return;
  }
  const mastered = Object.values(p.mastery).filter(v => v >= 3).length;
  const acc = p.totalAnswered ? Math.round(p.totalCorrect / p.totalAnswered * 100) : 0;
  const masteryPct = Math.round(mastered / learned * 100);
  document.getElementById("progUpdated").textContent = "最後練習 " + (p.lastDate || "");
  body.innerHTML = todayCardHtml(p) +
    "<div class='stat-grid'>" +
      "<div class='stat-card hero'><div class='num'>" + (p.streak || 0) + " <small>天</small></div><div class='lbl'>🔥 連續學習</div></div>" +
      "<div class='stat-card'><div class='num'>" + (p.todayCount || 0) + "</div><div class='lbl'>今日已練習</div></div>" +
      "<div class='stat-card'><div class='num'>" + learned + "</div><div class='lbl'>已學單字</div></div>" +
      "<div class='stat-card'><div class='num'>" + acc + "<small>%</small></div><div class='lbl'>總正確率</div></div>" +
      "<div class='stat-card wide'><div class='num'>" + mastered + " <small>/ " + learned + "</small></div><div class='lbl'>已精熟單字（答對 3 次以上）</div>" +
        "<div class='mastery-bar'><div style='width:" + masteryPct + "%'></div></div></div>" +
    "</div>";
}

// 今日目標圈 + 一週打卡
function todayCardHtml(p) {
  const goal = p.dailyGoal || 10;
  const todayN = p.todayCount || 0;
  const pct = Math.min(100, Math.round(todayN / goal * 100));
  const hit = todayN >= goal;
  const days = p.days || {};
  const labels = ["日", "一", "二", "三", "四", "五", "六"];
  let cells = "";
  for (let i = 6; i >= 0; i--) {
    const ms = Date.now() - i * 86400000;
    const cnt = days[ymdLocal(ms)] || 0;
    let cls = "day-dot";
    if (cnt >= goal && cnt > 0) cls += " goal"; else if (cnt > 0) cls += " on";
    if (i === 0) cls += " today";
    const lbl = labels[new Date(ms + 8 * 3600000).getUTCDay()];
    cells += "<div class='day-cell'><div class='" + cls + "'></div><div class='day-lbl'>" + lbl + "</div></div>";
  }
  const msg = hit ? "🎉 今天達標囉，好棒！" : ("今天再練 " + (goal - todayN) + " 個字就達標 💪");
  const gset = [5, 10, 20].map(n =>
    "<button class='" + (goal === n ? "active" : "") + "' onclick='setDailyGoal(" + n + ")'>" + n + "</button>").join("");
  return "<div class='today-card'>" +
      "<div class='today-top'>" +
        "<div class='goal-ring" + (hit ? " done" : "") + "' style='--pct:" + pct + "'>" +
          "<div class='goal-inner'><b>" + todayN + "</b><span>/ " + goal + " 字</span></div>" +
        "</div>" +
        "<div class='today-right'>" +
          "<div class='today-msg" + (hit ? " hit" : "") + "'>" + msg + "</div>" +
          "<div class='week-row'>" + cells + "</div>" +
        "</div>" +
      "</div>" +
      "<div class='goal-set'><span class='gs-label'>每日目標</span>" + gset + "</div>" +
    "</div>";
}

// 每日練習：抽 10 個字，每題隨機一種題型（拼字／填字／英翻中／發音混合）
// 有加入班級 → 從班級單字庫抽、題型照老師設定；否則從核心題庫、全 4 種
function startDailyQuiz() {
  const msg = document.getElementById("startMsg");
  if (msg) msg.classList.add("hidden");
  const cls = loadClass();
  let src, base;
  if (cls && cls.words && cls.words.length) {
    const bag = {};
    (typeof DICT !== "undefined" ? DICT : []).forEach(d => { bag[d.w.toLowerCase()] = d; });
    allWords().forEach(v => { if (!bag[v.w.toLowerCase()]) bag[v.w.toLowerCase()] = v; });
    src = cls.words.map(w => bag[String(w).toLowerCase()]).filter(Boolean);
    base = (cls.types && cls.types.length) ? cls.types.slice() : ["spell", "fill", "zh", "listen"];
  } else {
    src = (typeof DICT !== "undefined")
      ? DICT.filter(d => d.enriched)
      : allWords().filter(v => hasZh(v) && (v.en || v.ex));
    base = ["spell", "fill", "zh", "listen"];
  }
  if (!src.length) {
    if (msg) { msg.textContent = cls ? "😅 這個班級還沒有單字，請老師先加字。" : "😅 單字資料還在載入，等一下再試一次。"; msg.classList.remove("hidden"); }
    return;
  }
  const N = Math.min(10, src.length);
  const list = shuffle(src.slice()).slice(0, N);
  // 先湊出均衡的題型組合再打亂，避免整組剛好都同一種
  const types = shuffle(list.map((_, i) => base[i % base.length]));
  // 保險：萬一某字資料不夠玩被分到的題型，改成它玩得動的
  list.forEach((v, i) => {
    if (!wordFitsMode(v, types[i])) {
      const fit = base.filter(t => wordFitsMode(v, t));
      types[i] = fit[Math.floor(Math.random() * fit.length)] || "spell";
    }
  });
  cur = { list: list, types: types, idx: 0, wrong: [], answered: false, daily: true };
  const s = history.state;
  if (s && (s.view === "quiz" || s.view === "result")) history.replaceState({ view: "quiz" }, "");
  else history.pushState({ view: "quiz" }, "");
  show("quiz");
  renderQuestion();
}

function currentWord() { return cur.list[cur.idx]; }
// 當題題型：每日練習時每題各自帶一種；一般練習則用全域 opts.qtype
function qType() { return (cur.types && cur.types[cur.idx]) ? cur.types[cur.idx] : opts.qtype; }
// 「再練一次」：剛剛是每日練習就再抽一組，否則照設定重練
function repeatQuiz() { if (cur && cur.daily) startDailyQuiz(); else startQuiz(); }

function esc(s) { return (s || "").replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c])); }

// 在例句裡找出要挖空的字（優先完全相符，再找同字根的變化形，如 negotiate→negotiated）
function findFormInSentence(sentence, word) {
  if (!sentence) return null;
  const lc = sentence.toLowerCase(), wl = word.toLowerCase();
  let i = lc.indexOf(wl);
  while (i >= 0) {
    const beforeOk = i === 0 || !/[a-z]/i.test(sentence[i - 1]);
    const afterCh = sentence[i + wl.length];
    const afterOk = afterCh === undefined || !/[a-z]/i.test(afterCh);
    if (beforeOk && afterOk) return sentence.substr(i, wl.length);
    i = lc.indexOf(wl, i + 1);
  }
  if (!word.includes(" ") && wl.length >= 4) {
    let best = null, bestLen = 0;
    for (const m of sentence.matchAll(/[A-Za-z]+/g)) {
      const t = m[0], tl = t.toLowerCase();
      let p = 0;
      while (p < tl.length && p < wl.length && tl[p] === wl[p]) p++;
      if (p >= Math.min(4, wl.length - 1) && Math.abs(tl.length - wl.length) <= 3 && p > bestLen) { best = t; bestLen = p; }
    }
    return best;
  }
  return null;
}

function renderQuestion() {
  const v = currentWord();
  const total = cur.list.length;
  cur.answered = false;
  document.getElementById("qProgress").textContent = (cur.idx + 1) + " / " + total;
  document.getElementById("qBar").style.width = (cur.idx / total * 100) + "%";

  // 依練習類型切換顯示的區塊（每日練習時每題各自的類型）
  const t = qType();
  document.getElementById("qSentence").classList.toggle("hidden", t === "listen");
  document.getElementById("qAudio").classList.toggle("hidden", t !== "listen");
  document.getElementById("qHintPill").classList.toggle("hidden", t === "zh");
  document.getElementById("qChoices").classList.toggle("hidden", t !== "zh");
  document.getElementById("qPool").classList.toggle("hidden", t !== "spell");
  document.getElementById("qAnswer").classList.toggle("hidden", t !== "spell");
  document.getElementById("qTypeInput").classList.toggle("hidden", !(t === "fill" || t === "listen"));
  document.getElementById("qBackspace").style.display = t === "spell" ? "" : "none";
  document.getElementById("qFeedback").innerHTML = "";
  document.getElementById("qExHint").innerHTML = "";
  if (t === "zh") { renderZhQuestion(v); return; }
  if (t === "fill" || t === "listen") { renderTypeQuestion(v, t); return; }

  document.getElementById("qPos").textContent = v.pos || "";
  document.getElementById("qZh").textContent = v.zh || "";

  // 答案：優先用例句裡出現的字形
  const form = findFormInSentence(v.ex, v.w) || v.w;
  cur.answer = form;
  cur.answerLc = form.toLowerCase();

  // 鎖定的位置＝前 N 個提示字母 + 空格（片語用）
  const letterLen = form.replace(/ /g, "").length;
  const hintCount = Math.min(opts.hint, Math.max(0, letterLen - 1));
  cur.locked = [];
  let seen = 0;
  for (let i = 0; i < form.length; i++) {
    if (form[i] === " ") cur.locked[i] = true;
    else { cur.locked[i] = seen < hintCount; seen++; }
  }
  cur.filled = form.split("").map((ch, i) => cur.locked[i] ? ch : null);
  const poolChars = [];
  for (let i = 0; i < form.length; i++) if (!cur.locked[i]) poolChars.push(form[i]);
  cur.pool = shuffle(poolChars).map(ch => ({ ch, used: false }));
  cur.placed = [];

  renderSentence(v, form, hintCount);
  renderPool();
  renderAnswer();

  document.getElementById("qFeedback").innerHTML = "";
  document.getElementById("qStatus").textContent = "點下方字母，或直接用鍵盤打字";
  document.getElementById("qCheckBtn").textContent = "確認";
  document.getElementById("qBackspace").style.visibility = "visible";
}

// ===== 填字／發音：自由打字模式 =====
function renderTypeQuestion(v, mode) {
  // 填字：對照例句裡的字形；發音：直接拼出字典原形
  const answer = mode === "listen" ? v.w : (findFormInSentence(v.ex, v.w) || v.w);
  cur.answer = answer;
  cur.answerLc = answer.toLowerCase();
  document.getElementById("qPos").textContent = v.pos || "";
  // 發音模式沒有例句可看，缺中文時改用英文定義當提示
  document.getElementById("qZh").textContent = mode === "listen" ? (v.zh || v.en || "") : (v.zh || "");

  const input = document.getElementById("qTypeInput");
  input.value = "";
  input.disabled = false;
  input.className = "type-input";
  input.placeholder = "輸入單字後按 Enter";

  if (mode === "fill") {
    renderSentence(v, answer, 1); // 例句挖空，給第一個字母當開頭提示
    document.getElementById("qStatus").textContent = v.ex ? "看例句與中文，第一個字母幫你開頭了" : "看提示，把單字拼出來";
  } else {
    document.getElementById("qAudio").innerHTML =
      "<button class='audio-btn' onclick='speak(cur.answer)'>🔊</button>";
    document.getElementById("qStatus").textContent = "聽發音，把單字拼出來（點 🔊 可重播）";
    speak(answer);
  }
  document.getElementById("qCheckBtn").textContent = "確認";
  setTimeout(() => input.focus(), 60);
}

// ===== 英翻中選擇題模式 =====
function zhDistractors(v) {
  const clean = x => x.w !== v.w && x.zh && x.zh !== v.zh && x.zh !== "（內容整理中）";
  let pool = practicePool().filter(clean);
  if (pool.length < 2 && typeof DICT !== "undefined") pool = DICT.filter(clean);
  return shuffle(pool.slice()).slice(0, 2).map(x => x.zh);
}

function renderZhQuestion(v) {
  const form = findFormInSentence(v.ex, v.w) || v.w;
  cur.answer = form;
  cur.pool = [];
  cur.placed = [];

  // 題目：只顯示英文例句，中文翻譯藏進「提示」按鈕（避免直接洩答案）
  const el = document.getElementById("qSentence");
  const full = v.ex || "";
  const cjk = full.search(/[一-鿿]/);          // 找第一個中文字，前面是英文、後面是翻譯
  const enPart = cjk >= 0 ? full.slice(0, cjk).trim() : full;
  const zhPart = cjk >= 0 ? full.slice(cjk).trim() : "";
  const idx = enPart.indexOf(form);
  if (idx >= 0) {
    el.innerHTML = esc(enPart.slice(0, idx)) + "<span class='hl'>" + esc(form) + "</span>" + esc(enPart.slice(idx + form.length));
  } else {
    el.innerHTML = "<span class='hl'>" + esc(v.w) + "</span>" + (v.en ? "<br><span class='q-def'>" + esc(v.en) + "</span>" : "");
  }

  // 中文提示：點按鈕才顯示例句翻譯
  const hintBox = document.getElementById("qExHint");
  if (zhPart) {
    hintBox.innerHTML =
      "<button type='button' class='hint-btn' onclick='revealExHint(this)'>💡 看例句中文提示</button>" +
      "<div class='hint-zh hidden'>" + esc(zhPart) + "</div>";
  } else {
    hintBox.innerHTML = "";
  }

  // 三個選項：一個正解＋兩個隨機別字的中文
  const box = document.getElementById("qChoices");
  box.innerHTML = "";
  const options = shuffle([{ zh: v.zh, ok: true }].concat(zhDistractors(v).map(zh => ({ zh: zh, ok: false }))));
  options.forEach(o => {
    const b = document.createElement("button");
    b.className = "zh-opt";
    b.textContent = o.zh;
    if (o.ok) b.dataset.correct = "1";
    b.onclick = () => answerZh(b, o.ok, v);
    box.appendChild(b);
  });

  document.getElementById("qFeedback").innerHTML = "";
  document.getElementById("qStatus").textContent = "選出正確的中文意思（電腦可按 1 / 2 / 3）";
  document.getElementById("qCheckBtn").textContent = "確認";
}

// 英翻中：點「提示」顯示例句中文翻譯，按鈕隨即隱藏
function revealExHint(btn) {
  const zh = btn.parentNode.querySelector(".hint-zh");
  if (zh) zh.classList.remove("hidden");
  btn.classList.add("hidden");
}

function answerZh(btn, ok, v) {
  if (cur.answered) return;
  cur.answered = true;
  if (!ok) cur.wrong.push(v);
  document.querySelectorAll("#qChoices .zh-opt").forEach(b => {
    b.disabled = true;
    if (b.dataset.correct) b.classList.add("ok");
  });
  if (!ok) btn.classList.add("bad");
  document.getElementById("qStatus").textContent = "";
  document.getElementById("qFeedback").innerHTML =
    (ok ? "✅ 正確！" : "❌ 正確答案是綠色那個") +
    "<span class='word'> " + esc(v.w) + "</span> /" + (v.phon || "") + "/" +
    "<button class='speak sm' onclick='speak(cur.answer)'>🔊</button><br>" +
    "<span class='ex'>" + esc(v.pos || "") + " " + esc(v.zh || "") + "</span>";
  document.getElementById("qCheckBtn").textContent = cur.idx + 1 < cur.list.length ? "下一題 →" : "看成績";
  speak(cur.answer || v.w);
}

function renderSentence(v, form, hintCount) {
  const el = document.getElementById("qSentence");
  const sentence = v.ex || "";
  const idx = sentence.indexOf(form);
  if (idx < 0) {
    el.innerHTML = "<span class='q-def'>" + (esc(v.en) || "根據提示拼出單字") + "</span>";
    return;
  }
  let blank = "", seen = 0;
  for (let i = 0; i < form.length; i++) {
    if (form[i] === " ") { blank += "<span class='bk-space'></span>"; continue; }
    blank += seen < hintCount ? "<span class='bk-hint'>" + form[i] + "</span>" : "<span class='bk-line'></span>";
    seen++;
  }
  el.innerHTML = esc(sentence.slice(0, idx)) + "<span class='blank'>" + blank + "</span>" + esc(sentence.slice(idx + form.length));
}

function renderPool() {
  const el = document.getElementById("qPool");
  el.innerHTML = "";
  cur.pool.forEach((p, i) => {
    const b = document.createElement("button");
    b.className = "pool-letter" + (p.used ? " used" : "");
    b.textContent = p.ch;
    b.onclick = () => tapLetter(i);
    el.appendChild(b);
  });
}

function renderAnswer() {
  const el = document.getElementById("qAnswer");
  el.innerHTML = "";
  for (let i = 0; i < cur.answer.length; i++) {
    if (cur.answer[i] === " ") { const g = document.createElement("span"); g.className = "ans-space"; el.appendChild(g); continue; }
    const t = document.createElement("span");
    const ch = cur.filled[i];
    if (cur.locked[i]) { t.className = "ans-slot locked"; t.textContent = ch; }
    else if (ch != null) { t.className = "ans-slot filled"; t.textContent = ch; }
    else { t.className = "ans-slot empty"; }
    el.appendChild(t);
  }
}

function nextEmptySlot() {
  for (let i = 0; i < cur.answer.length; i++)
    if (!cur.locked[i] && cur.answer[i] !== " " && cur.filled[i] == null) return i;
  return -1;
}

function tapLetter(poolIdx) {
  if (cur.answered) return;
  const p = cur.pool[poolIdx];
  if (p.used) return;
  const slot = nextEmptySlot();
  if (slot < 0) return;
  cur.filled[slot] = p.ch;
  p.used = true;
  cur.placed.push({ slot, poolIdx });
  renderPool();
  renderAnswer();
  // 填滿且拼對就直接顯示正確，不用按確認
  if (nextEmptySlot() < 0 && cur.filled.join("").toLowerCase() === cur.answerLc) check();
}

function popLetter() {
  if (cur.answered) return;
  const last = cur.placed.pop();
  if (!last) return;
  cur.filled[last.slot] = null;
  cur.pool[last.poolIdx].used = false;
  renderPool();
  renderAnswer();
}

function typeLetter(ch) {
  ch = ch.toLowerCase();
  for (let i = 0; i < cur.pool.length; i++)
    if (!cur.pool[i].used && cur.pool[i].ch.toLowerCase() === ch) { tapLetter(i); return; }
}

function check() {
  if (cur.answered) { next(); return; }
  if (qType() === "zh") { document.getElementById("qStatus").textContent = "先選一個答案喔"; return; }
  // 填字／發音：比對打字輸入框
  if (qType() === "fill" || qType() === "listen") {
    const input = document.getElementById("qTypeInput");
    const guess = input.value.trim();
    if (!guess) { document.getElementById("qStatus").textContent = "先打出你的答案喔"; input.focus(); return; }
    cur.answered = true;
    input.disabled = true;
    const v = currentWord();
    const ok = guess.toLowerCase() === cur.answerLc;
    input.classList.add(ok ? "type-ok" : "type-bad");
    if (!ok) cur.wrong.push(v);
    document.getElementById("qStatus").textContent = "";
    document.getElementById("qFeedback").innerHTML =
      (ok ? "✅ 正確！" : "❌ 正確答案：") +
      "<span class='word'> " + cur.answer + "</span> /" + (v.phon || "") + "/" +
      "<button class='speak sm' onclick='speak(cur.answer)'>🔊</button><br>" +
      "<span class='ex'>" + esc(v.pos) + " " + esc(v.zh) + "</span>";
    document.getElementById("qCheckBtn").textContent = cur.idx + 1 < cur.list.length ? "下一題 →" : "看成績";
    speak(cur.answer);
    return;
  }
  if (nextEmptySlot() >= 0) { document.getElementById("qStatus").textContent = "還沒填完喔"; return; }
  cur.answered = true;
  const v = currentWord();
  const ok = cur.filled.join("").toLowerCase() === cur.answerLc;
  if (!ok) cur.wrong.push(v);
  document.querySelectorAll("#qAnswer .ans-slot").forEach(s => {
    if (!s.classList.contains("locked")) s.classList.add(ok ? "ok" : "bad");
  });
  document.getElementById("qStatus").textContent = "";
  document.getElementById("qFeedback").innerHTML =
    (ok ? "✅ 正確！" : "❌ 正確答案：") +
    "<span class='word'> " + cur.answer + "</span> /" + (v.phon || "") + "/" +
    "<button class='speak sm' onclick='speak(cur.answer)'>🔊</button><br>" +
    "<span class='ex'>" + esc(v.pos) + " " + esc(v.zh) + "</span>";
  document.getElementById("qBackspace").style.visibility = "hidden";
  document.getElementById("qCheckBtn").textContent = cur.idx + 1 < cur.list.length ? "下一題 →" : "看成績";
  speak(cur.answer);
}

function next() {
  cur.idx++;
  if (cur.idx < cur.list.length) renderQuestion();
  else finish();
}

function finish() {
  const total = cur.list.length;
  const right = total - cur.wrong.length;
  const pct = Math.round(right / total * 100);
  recordSession(cur.list, cur.wrong);
  document.getElementById("rScore").textContent = pct + "%";
  document.getElementById("rMsg").textContent =
    pct === 100 ? "全對！滿分 🎉" : "答對 " + right + " / " + total + "，錯的字再看一眼";
  const rv = document.getElementById("rReview");
  if (cur.wrong.length) {
    rv.classList.remove("hidden");
    rv.innerHTML = cur.wrong.map(v =>
      '<div class="review-item"><b>' + v.w + "</b> <span style='color:var(--sub)'>/" + v.phon + "/</span><div>" +
      v.pos + " " + v.zh + "<br>" + v.ex + "</div></div>"
    ).join("");
  } else {
    rv.classList.add("hidden");
  }
  history.replaceState({ view: "result" }, "");
  show("result");
}

let detailWord = null;
let detailList = [];
let detailIndex = -1;

function stepDetail(dir) {
  const ni = detailIndex + dir;
  if (ni < 0 || ni >= detailList.length) return;
  showDetail(detailList[ni]);
}

function showDetail(v) {
  detailWord = v;
  detailIndex = detailList.findIndex(x => x.w === v.w);
  const hasList = detailIndex >= 0 && detailList.length > 1;
  document.getElementById("dPrev").classList.toggle("hidden", !hasList);
  document.getElementById("dNext").classList.toggle("hidden", !hasList);
  document.getElementById("dPrev").disabled = detailIndex <= 0;
  document.getElementById("dNext").disabled = detailIndex >= detailList.length - 1;
  document.getElementById("dWord").textContent = v.w;
  document.getElementById("dPhon").textContent = v.phon ? "/" + v.phon + "/" : "";
  document.getElementById("dPos").textContent = v.pos;
  document.getElementById("dZh").textContent = v.zh;
  document.getElementById("dEn").textContent = v.en || "（待補充）";
  document.getElementById("dEx").textContent = v.ex || "（待補充）";
  document.getElementById("dUsage").textContent = v.usage || "（詳細內容製作中，之後自動補上）";
  document.getElementById("dSyn").textContent = v.syn ? v.syn + "：" + v.synNote : "（待補充——把這個字丟給 Claude 就會補上）";
  document.getElementById("dAdded").textContent = "加入日期：" + v.added + (v.custom ? "（快速新增，存在此裝置）" : "");
  document.getElementById("dRemoveBtn").classList.toggle("hidden", !v.custom);
  document.getElementById("detailOverlay").classList.remove("hidden");
}
function closeDetail() { document.getElementById("detailOverlay").classList.add("hidden"); }
function removeCurrent() {
  if (!detailWord || !detailWord.custom) return;
  saveCustom(loadCustom().filter(c => c.w !== detailWord.w));
  closeDetail();
  renderHome();
  if (!document.getElementById("letterPage").classList.contains("hidden")) {
    openLetterPage(letterCtx.source, letterCtx.letter);
  }
}

// 挑裝置裡最好聽的英文聲音（避免挑到機械音或中文腔）
let _enVoice = null;
function pickEnglishVoice() {
  if (typeof speechSynthesis === "undefined") return null;
  const voices = speechSynthesis.getVoices();
  if (!voices.length) return null;
  const en = voices.filter(v => /^en([-_]|$)/i.test(v.lang));
  const pool = en.length ? en : voices;
  const prefer = ["enhanced", "premium", "natural", "neural", "siri", "samantha", "ava", "allison", "google us english", "google uk english"];
  for (const key of prefer) {
    const hit = pool.find(v => (v.name + " " + (v.voiceURI || "")).toLowerCase().includes(key));
    if (hit) return hit;
  }
  return pool.find(v => /en[-_]us/i.test(v.lang)) || pool[0];
}
if (typeof speechSynthesis !== "undefined") {
  _enVoice = pickEnglishVoice();
  speechSynthesis.onvoiceschanged = () => { _enVoice = pickEnglishVoice(); };
}

function speak(word) {
  if (!word) return;
  let done = false;
  const fallback = () => { if (done) return; done = true; speakLocal(word); };
  // 1) 優先用線上清晰的英文發音，播不出來（沒網路／被擋）就退回裝置語音
  try {
    const url = "https://translate.google.com/translate_tts?ie=UTF-8&tl=en&client=tw-ob&q=" + encodeURIComponent(word);
    const audio = new Audio(url);
    audio.onplaying = () => { done = true; };
    audio.onerror = fallback;
    const p = audio.play();
    if (p && p.catch) p.catch(fallback);
  } catch (e) { fallback(); }
}

// 裝置內建語音（備援）
function speakLocal(word) {
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(word);
    u.lang = "en-US";
    u.rate = 0.9;
    if (!_enVoice) _enVoice = pickEnglishVoice();
    if (_enVoice) u.voice = _enVoice;
    speechSynthesis.speak(u);
  } catch (e) {}
}

// 練習中的鍵盤操作：打字母＝填入配對的字母、Backspace＝退一格、Enter＝確認／下一題
document.addEventListener("keydown", e => {
  if (document.getElementById("quiz").classList.contains("hidden")) return;
  if (e.key === "Enter") { e.preventDefault(); check(); return; }
  if (cur.answered) return;
  if (qType() === "zh") {
    if (/^[1-3]$/.test(e.key)) {
      const b = document.querySelectorAll("#qChoices .zh-opt")[+e.key - 1];
      if (b && !b.disabled) b.click();
    }
    return;
  }
  // 填字／發音用原生輸入框，讓瀏覽器自己處理打字
  if (qType() === "fill" || qType() === "listen") return;
  if (e.key === "Backspace") { e.preventDefault(); popLetter(); }
  else if (/^[a-zA-Z]$/.test(e.key)) { e.preventDefault(); typeLetter(e.key); }
});
document.getElementById("searchInput").addEventListener("keydown", e => {
  if (e.key === "Enter") lookup();
});

// 字卡上左右滑＝上一個／下一個單字；電腦可用鍵盤 ← → 鍵
const detailCard = document.querySelector("#detailOverlay .detail");
let cardTouch = null;
detailCard.addEventListener("touchstart", e => {
  if (e.touches[0].clientX < 30) return; // 左邊緣保留給「拖動返回」手勢
  cardTouch = { x: e.touches[0].clientX, y: e.touches[0].clientY };
}, { passive: true });
detailCard.addEventListener("touchend", e => {
  if (!cardTouch) return;
  const dx = e.changedTouches[0].clientX - cardTouch.x;
  const dy = Math.abs(e.changedTouches[0].clientY - cardTouch.y);
  cardTouch = null;
  if (Math.abs(dx) < 60 || Math.abs(dx) < dy * 1.5) return; // 捲動內文不觸發
  stepDetail(dx < 0 ? 1 : -1); // 往左滑＝下一個，往右滑＝上一個
}, { passive: true });

document.addEventListener("keydown", e => {
  if (document.getElementById("detailOverlay").classList.contains("hidden")) return;
  if (e.key === "ArrowRight") stepDetail(1);
  else if (e.key === "ArrowLeft") stepDetail(-1);
  else if (e.key === "Escape") closeDetail();
});

// ===== 手機：從畫面左邊緣拖動頁面返回（頁面跟著手指滑動，iOS 手感） =====
const BACKABLE = ["library", "dictLib", "letterPage", "result"];
let edgeDrag = null;

document.addEventListener("touchstart", e => {
  if (e.touches[0].clientX > 30) return; // 只從最左邊緣 30px 內開始才算
  const overlayOpen = !document.getElementById("detailOverlay").classList.contains("hidden");
  const view = BACKABLE.find(v => !document.getElementById(v).classList.contains("hidden"));
  if (!overlayOpen && !view) return;
  edgeDrag = {
    startX: e.touches[0].clientX,
    startY: e.touches[0].clientY,
    el: overlayOpen ? document.querySelector("#detailOverlay .detail") : document.getElementById(view),
    overlay: overlayOpen,
    active: false
  };
}, { passive: true });

document.addEventListener("touchmove", e => {
  if (!edgeDrag) return;
  const dx = e.touches[0].clientX - edgeDrag.startX;
  const dy = Math.abs(e.touches[0].clientY - edgeDrag.startY);
  if (!edgeDrag.active) {
    if (dx > 10 && dx > dy) { edgeDrag.active = true; edgeDrag.el.style.transition = "none"; }
    else if (dy > 10) { edgeDrag = null; return; } // 是上下捲動，放行
  }
  if (edgeDrag.active) {
    e.preventDefault();
    edgeDrag.el.style.transform = "translateX(" + Math.max(0, dx) + "px)";
  }
}, { passive: false });

document.addEventListener("touchend", e => {
  if (!edgeDrag) return;
  const drag = edgeDrag;
  edgeDrag = null;
  const dx = e.changedTouches[0].clientX - drag.startX;
  drag.el.style.transition = "transform .2s ease-out";
  if (drag.active && dx > window.innerWidth / 3) {
    drag.el.style.transform = "translateX(100%)"; // 滑出畫面再返回
    setTimeout(() => {
      drag.el.style.transition = "";
      drag.el.style.transform = "";
      if (drag.overlay) closeDetail();
      else history.back();
    }, 200);
  } else {
    drag.el.style.transform = ""; // 沒滑過門檻，彈回原位
    setTimeout(() => { drag.el.style.transition = ""; }, 200);
  }
}, { passive: true });

// ===== 佈景主題 =====
const THEMES = [
  { id: "forest", name: "森林綠", bg: "#f7f7f2", ac: "#4a7c59" },
  { id: "ocean",  name: "海洋藍", bg: "#eef4f8", ac: "#2e6f9e" },

  { id: "berry",  name: "莓果紫", bg: "#f4f0f8", ac: "#7a4fa0" },
  { id: "sakura", name: "櫻花粉", bg: "#fbf0f3", ac: "#c65b7c" },
  { id: "night",  name: "夜間",   bg: "#16181c", ac: "#5aa06f" },
];
function currentTheme() {
  let id = "forest";

function applyTheme(id) {

  document.documentElement.dataset.theme = t.id;
  try { localStorage.setItem("zibaoTheme", t.id); } catch (e) {}
  document.querySelectorAll("#swatches .swatch").forEach(s => s.classList.toggle("active", s.dataset.id === t.id));
  const n = document.getElementById("tpName");
  if (n) n.textContent = t.name;
}
function renderThemes() {
  const box = document.getElementById("swatches");

  box.innerHTML = "";

    const b = document.createElement("button");
    b.className = "swatch";
    b.dataset.id = t.id;
    b.title = t.name;

    b.onclick = () => applyTheme(t.id);

  });

}
